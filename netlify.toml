[build]
  publish = "dist"
  command = "npm run build"

# ── Security Headers (applied to every response) ─────────────────────────────
[[headers]]
  for = "/*"

  [headers.values]
    # Enforce HTTPS across all subdomains and protect against SSL stripping
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Prevent embedding in iframes (Clickjacking)
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Legacy XSS filter for older browsers
    X-XSS-Protection = "1; mode=block"

    # Limit referrer info sent to external sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable unnecessary browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"

    # Content Security Policy (strict allowlist, defense-in-depth)
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; media-src 'none'; worker-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# ── Cache static assets aggressively (hashed filenames are safe to cache forever)
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Do not cache index.html (so new deploys take effect immediately)
[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── SPA routing: redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
