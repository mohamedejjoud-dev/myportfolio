# Netlify configuration for this static site.
#
# The build command and publish directory stored in the Netlify UI are left
# over from the earlier Vite version of this repository. `npm run build` used to
# fail because this project had no package.json.
#
# package.json and build.mjs now make that command succeed for real: they stage
# the site's runtime files into dist/, which is what gets published. So the
# build passes whether these settings come from this file or from the UI.
#
# Settings in this file take precedence over the UI when present.

[build]
  command = "npm run build"
  publish = "dist"
